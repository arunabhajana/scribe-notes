# No default permission set: each window receives only its own commands.
[[permission]]
identifier = "main-commands"
description = "Account, settings, export and notification commands for the main window."
commands.allow = ["set_autostart_enabled", "get_autostart_enabled", "get_device_info", "save_export_file", "set_capture_shortcut", "set_capture_enabled", "pause_capture_shortcut", "set_capture_account", "prepare_workspace_data_reset", "restart_after_data_reset", "get_capture_account", "configure_desktop_notifications", "show_desktop_notification", "get_in_app_notifications", "dismiss_in_app_notification", "clear_workspace_notifications"]

[[permission]]
identifier = "capture-commands"
description = "Save capture notifications and return to the main window."
commands.allow = ["get_capture_account", "capture_saved", "finish_capture", "open_capture_main", "show_desktop_notification"]
