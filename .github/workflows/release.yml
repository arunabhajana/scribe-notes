name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out tag and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check tag, main ancestry, versions and public legal links
        id: version
        run: node scripts/check-version.mjs --release
        env:
          VITE_SCRIBE_WEBSITE_URL: ${{ vars.VITE_SCRIBE_WEBSITE_URL }}

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft-release:
    name: Create draft release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or application code execution in the job with write access.
      - name: Download installer from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-installer
          path: release-files
      - name: Verify assets and create SHA-256 checksum
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release-files/*-setup.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo 'Expected exactly one Windows x64 installer.' >&2
            exit 1
          fi
          cd release-files
          sha256sum -- *-setup.exe > SHA256SUMS.txt
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo 'The remote version tag changed during the build. No release will be created.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Review it manually; CI will not replace published assets.' >&2
            exit 1
          fi
          extra=()
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-files/*-setup.exe release-files/SHA256SUMS.txt \
            --verify-tag --target "$RELEASE_COMMIT" --title "Scribe $RELEASE_VERSION" \
            --draft --generate-notes "${extra[@]}"
